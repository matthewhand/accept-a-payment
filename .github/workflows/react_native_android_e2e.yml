name: React Native Android e2e tests

on: workflow_dispatch

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e_react_native_android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check for Stripe test credentials
        id: credentials
        env:
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.TEST_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.TEST_STRIPE_SECRET_KEY }}
        run: |
          if [[ "$STRIPE_PUBLISHABLE_KEY" == pk_test_* && "$STRIPE_SECRET_KEY" == sk_test_* ]]; then
            echo 'available=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Stripe test credentials are required to exercise card confirmation.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.credentials.outputs.available == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        if: steps.credentials.outputs.available == 'true'
        with:
          node-version: '24.22.3'

      - name: Enable KVM access
        if: steps.credentials.outputs.available == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the Android card tests
        if: steps.credentials.outputs.available == 'true'
        uses: reactivecircus/android-emulator-runner@v2
        env:
          STRIPE_PUBLISHABLE_KEY: ${{ secrets.TEST_STRIPE_PUBLISHABLE_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.TEST_STRIPE_SECRET_KEY }}
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: bash .github/workflows/react_native_android_e2e.sh

      - uses: actions/upload-artifact@v4
        if: failure() && steps.credentials.outputs.available == 'true'
        with:
          name: react-native-android-screenshots
          path: custom-payment-flow/client/react-native-expo/tmp/screenshots
